[mypy]
python_version = 3.10
files = tests, samuel/**/tests
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = False
warn_return_any = True
warn_unused_configs = True

# Tests deliberately use small duck-typed fakes, replace methods directly, and
# inspect concrete wrapper internals that are not part of the public protocols.
# Production code remains subject to the stricter policy in pyproject.toml.
disable_error_code = arg-type, attr-defined, method-assign
