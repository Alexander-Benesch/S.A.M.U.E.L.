[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=10.2,<11"]
build-backend = "setuptools.build_meta"

[project]
name = "samuel"
dynamic = ["version"]
description = "Sicheres Autonomes Mehrschichtiges Ueberwachungs- und Entwicklungs-Logiksystem"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "argon2-cffi>=23.1,<26",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dashboard = [
    "jinja2>=3.1",
]
llm = [
    "anthropic>=0.40,<1",
    "openai>=1.50,<2",
]
github = [
    "cryptography>=43",
]
tree-sitter = [
    "tree-sitter>=0.24,<1",
    "tree-sitter-javascript>=0.24",
    "tree-sitter-typescript>=0.23",
]
dev = [
    "build>=1.2",
    "tomli>=2; python_version < '3.11'",
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.8",
    "mypy>=1.13",
    "tree-sitter>=0.24,<1",
    "tree-sitter-javascript>=0.24",
    "setuptools-scm>=10.2,<11",
]
ci = [
    "pip-audit>=2.7",
]
all = [
    "samuel[dashboard,llm,github,tree-sitter,dev,ci]",
]

[project.scripts]
samuel = "samuel.cli:main"
samuel-git-askpass = "samuel.adapters.git_transport.askpass:main"
samuel-release = "samuel.local_release:main"
samuel-extension = "samuel.extensions.cli:main"
samuel-documentation = "samuel.documentation_cli:main"

[tool.setuptools.packages.find]
include = ["samuel*"]

[tool.setuptools.package-data]
# #292: core/compliance/*.json muss mitgepackt werden, sonst Import-Fail bei pip-install
samuel = [
    "py.typed",
    "core/compliance/*.json",
    "core/prompts/*.md",
    "extensions/schemas/*.json",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0+unknown"

[tool.setuptools_scm.tag]
prefix = "v"
strict = true
regex = '^(?P<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:(?:a|b|rc)(?:0|[1-9]\d*))?)$'

[tool.pytest.ini_options]
testpaths = ["tests", "samuel"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E741", "B007", "SIM102"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = "(^|/)tests/"
