name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  # Bound an established Git HTTP transfer that stops making progress. The
  # job timeout below remains the outer bound for connection/setup failures.
  GIT_HTTP_LOW_SPEED_LIMIT: "1024"
  GIT_HTTP_LOW_SPEED_TIME: "30"

jobs:
  python-compatibility:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.21", "3.14.7"]
    runs-on: public-runner-example
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify image-baked Python ${{ matrix.python-version }}
        run: |
          test ! -S /var/run/docker.sock
          cached_root="/opt/hostedtoolcache/Python/${{ matrix.python-version }}"
          test -f "$cached_root/x64.complete"
          test -x "$cached_root/x64/bin/python"
          test "$("$cached_root/x64/bin/python" --version)" = "Python ${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create isolated test environment
        run: |
          python -m venv "$RUNNER_TEMP/samuel-venv"
          "$RUNNER_TEMP/samuel-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-index \
            /opt/hostedtoolcache/pip/pip-26.2.1-py3-none-any.whl
          test "$("$RUNNER_TEMP/samuel-venv/bin/python" -m pip --version | cut -d' ' -f2)" = "26.2.1"
          echo "$RUNNER_TEMP/samuel-venv/bin" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test supported Python
        run: pytest tests/ samuel/ -v --tb=short

  lint-and-test:
    needs: python-compatibility
    timeout-minutes: 30
    runs-on: public-runner-example
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify image-baked Python 3.12.14
        run: |
          test ! -S /var/run/docker.sock
          cached_root="/opt/hostedtoolcache/Python/3.12.14"
          test -f "$cached_root/x64.complete"
          test -x "$cached_root/x64/bin/python"
          test "$("$cached_root/x64/bin/python" --version)" = "Python 3.12.14"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"

      - name: Create isolated test environment
        run: |
          python -m venv "$RUNNER_TEMP/samuel-venv"
          "$RUNNER_TEMP/samuel-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-index \
            /opt/hostedtoolcache/pip/pip-26.2.1-py3-none-any.whl
          test "$("$RUNNER_TEMP/samuel-venv/bin/python" -m pip --version | cut -d' ' -f2)" = "26.2.1"
          echo "$RUNNER_TEMP/samuel-venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev,ci,github]"

      - name: Capability and documentation contract drift check
        run: python3 tools/control_matrix.py check

      - name: Deterministic developer wiki contract check
        run: python3 tools/wiki.py check

      - name: Container release contract drift check
        run: python tools/container_release.py check

      - name: Build and verify distribution license
        run: |
          dist_dir="$(mktemp -d)"
          python -m build --outdir "$dist_dir"
          python tools/verify_distribution_license.py "$dist_dir"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy samuel/ --ignore-missing-imports

      - name: Type check tests (mypy)
        run: mypy --config-file mypy-tests.ini

      - name: Tests
        run: pytest tests/ samuel/ -v --tb=short

      - name: Architecture tests
        run: pytest tests/test_architecture_v2.py -v

      - name: Security audit
        # Retry only inconclusive tool/transport failures. A valid report with
        # vulnerabilities fails immediately; exhaustion remains fail-closed.
        run: python tools/run_pip_audit.py --attempts 3 --delay-seconds 5

  release-gate:
    if: startsWith(gitea.ref, 'refs/tags/v')
    needs: lint-and-test
    timeout-minutes: 20
    runs-on: public-runner-example
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify image-baked Python 3.12.14
        run: |
          test ! -S /var/run/docker.sock
          cached_root="/opt/hostedtoolcache/Python/3.12.14"
          test -f "$cached_root/x64.complete"
          test -x "$cached_root/x64/bin/python"
          test "$("$cached_root/x64/bin/python" --version)" = "Python 3.12.14"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"

      - name: Create isolated test environment
        run: |
          python -m venv "$RUNNER_TEMP/samuel-venv"
          "$RUNNER_TEMP/samuel-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-index \
            /opt/hostedtoolcache/pip/pip-26.2.1-py3-none-any.whl
          test "$("$RUNNER_TEMP/samuel-venv/bin/python" -m pip --version | cut -d' ' -f2)" = "26.2.1"
          echo "$RUNNER_TEMP/samuel-venv/bin" >> "$GITHUB_PATH"

      - name: Install release dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build release artifacts from tagged commit
        run: |
          release_dist="$(mktemp -d)"
          python -m build --outdir "$release_dist"
          python tools/verify_distribution_license.py "$release_dist"
          python tools/release_gate.py \
            --mode post-tag \
            --restore-remote-tag \
            --tag "${GITHUB_REF_NAME}" \
            --commit-ref origin/main \
            --dist-dir "$release_dist"
